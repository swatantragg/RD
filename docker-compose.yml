# Royalty Reports - database, one-shot bootstrap (migrations + first client), API, background worker and web.
#   cp backend/.env.example backend/.env    then put strong passwords in it (see the file)
#   docker compose up -d --build            then open http://localhost:8080
# Every secret and setting comes from backend/.env; without that file nothing starts.
name: mrm

services:
  db:
    image: postgres:16-alpine
    env_file: ./backend/.env                  # POSTGRES_PASSWORD, MRM_OWNER_PASSWORD, MRM_APP_PASSWORD
    environment:
      POSTGRES_DB: mrm
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d mrm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  bootstrap:
    build: ./backend
    command: ["python", "-m", "mrm.cli", "bootstrap"]
    env_file: ./backend/.env
    environment:
      STORAGE_ROOT: /data/objects
    volumes:
      - objects:/data/objects
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      STORAGE_ROOT: /data/objects
      RD_WORKER: "off"                        # processing runs in the worker service below
    volumes:
      - objects:/data/objects
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "mrm.cli", "worker"]
    env_file: ./backend/.env
    environment:
      STORAGE_ROOT: /data/objects
    volumes:
      - objects:/data/objects
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      disable: true
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"   # this computer only; WEB_BIND=0.0.0.0 opens it to the network
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  objects:
