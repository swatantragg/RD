worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log main;

  limit_req_zone $binary_remote_addr zone=signin:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=40r/s;
  limit_req_status 429;

  # Docker's DNS, re-asked every 10 s: the API container can be recreated (new address) without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;
    client_max_body_size 70m;
    root /usr/share/nginx/html;
    set $api_upstream http://api:8000;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location ~ ^/api/auth/(login|signup)$ {
      limit_req zone=signin burst=5 nodelay;
      include /etc/nginx/security-headers.conf;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;      # the real peer only: a client cannot forge it
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
      limit_req zone=api burst=200 nodelay;
      include /etc/nginx/security-headers.conf;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;      # the real peer only: a client cannot forge it
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
